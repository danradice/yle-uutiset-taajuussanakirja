name: release

# Tagging vX.Y.Z publishes a release. workflow_dispatch runs the same gates
# without publishing, so the checks can be exercised without spending a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # gh release create needs it; nothing else does

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Stages 2-4 need no corpora and take seconds, so a release can always
      # afford to prove that every committed file is the one the committed
      # intermediates produce. If any of them is not, nothing gets published.
      - name: Rebuild everything from the committed intermediates
        run: |
          python3 scripts/split_homonym_counts.py
          python3 scripts/build_pos_subdictionaries.py
          python3 scripts/build_top_list.py

      - name: Fail if the committed data is not reproducible
        run: git diff --exit-code -- frequency_dicts/

      # The version only comes from a tag: on workflow_dispatch GITHUB_REF_NAME
      # is the branch the run started from, which is not a version.
      - name: Extract release notes from CHANGELOG.md
        run: |
          NOTES="$RUNNER_TEMP/RELEASE_NOTES.md"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          awk -v v="$VERSION" \
            '$0 ~ "^## \\["v"\\]" {f=1; next} f && /^## / {exit} f' \
            CHANGELOG.md > "$NOTES"

          if [ ! -s "$NOTES" ]; then
            if [ "$VERSION" = "dev" ]; then
              echo "dev run: no changelog section expected, continuing"
            else
              echo "no '## [$VERSION]' section in CHANGELOG.md --" \
                   "write the changelog entry before tagging $VERSION" >&2
              exit 1
            fi
          else
            echo "--- release notes for $VERSION ---"
            cat "$NOTES"
          fi

      # Zenodo builds the DOI record from .zenodo.json and ignores CITATION.cff
      # whenever it is present, so the two files describe the same release to two
      # services with nothing but this check keeping them in step. A stale version
      # in either is invisible until it has been published under a DOI.
      - name: Fail if the citation metadata does not match the tag
        run: python3 scripts/check_release_metadata.py "$VERSION"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Yle Uutisten taajuussanakirja $GITHUB_REF_NAME" \
            --notes-file "$NOTES" \
            --verify-tag \
            frequency_dicts/taajuussanakirja_top10000.tsv \
            frequency_dicts/taajuussanakirja_top10000.csv
